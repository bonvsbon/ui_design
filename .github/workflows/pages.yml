# Publishes the offline Design Library to GitHub Pages on every push to main.
# The library is prebuilt (python3 library/_build/build-design-library.py), so this
# workflow only uploads the folder — no Node or Python build runs here.
name: Publish Design Library

on:
  push:
    branches: [main]
    paths: ['library/GAMBOL-Design-Library/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: library/GAMBOL-Design-Library
      - id: deployment
        uses: actions/deploy-pages@v4
